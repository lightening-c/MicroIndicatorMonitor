# 图表配置
chart:
  daily_display_points: 120
  ma_short: 5
  ma_long: 20
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  boll_period: 20
  boll_std: 2

# 情绪综合指数权重
sentiment:
  margin_weight: 0.25     # 融资余额变化
  breadth_weight: 0.25    # 涨跌比
  volume_weight: 0.25     # 成交量偏离
  volatility_weight: 0.25  # 波动率

# ETF 估值阈值
etf_valuation:
  undervalued_threshold: 20    # PE 分位 < 20% 低估
  overvalued_threshold: 80     # PE 分位 > 80% 高估
  pe_lookback_years: 5         # PE 分位默认回看年数
  pb_lookback_years: 5         # PB 分位默认回看年数

# 国家队资金跟踪：ETF 总市值 / 指数流通市值，及其 20/60 日斜率
# 数据源：份额(上交所 query.sse.com.cn / 深交所 akshare fund_scale_daily_szse)
#         价格(akshare fund_etf_hist_em)  点位(中证指数 / 东财K线)  流通市值(东财快照标定)
nfgj:
  start_date: "20180101"
  # ETF 基础信息表（含 ETF代码/ETF简称/跟踪指数代码）
  # 相对路径基于项目根目录；也可填绝对路径。文件不存在时使用 data/nfgj_etf_list_*.csv 缓存
  etf_list_source: "data/etf_list_source.csv"
  indices:
    - key: sz50
      name: 上证50
      etf_track: "000016.SH"
      csindex_code: "000016"
      em_secid: "1.000016"
    - key: hs300
      name: 沪深300
      etf_track: "000300.SH"
      csindex_code: "000300"
      em_secid: "1.000300"
    - key: zz500
      name: 中证500
      etf_track: "000905.SH"
      csindex_code: "000905"
      em_secid: "1.000905"
    - key: zz1000
      name: 中证1000
      etf_track: "000852.SH"
      csindex_code: "000852"
      em_secid: "1.000852"
    - key: zz2000
      name: 中证2000
      etf_track: "932000.CSI"
      csindex_code: "932000"
      em_secid: "2.932000"
    - key: star50
      name: 科创50
      etf_track: "000688.SH"
      csindex_code: "000688"
      em_secid: "1.000688"
    - key: chinext
      name: 创业板指
      etf_track: "399006.SZ"
      csindex_code: ""          # 中证指数不覆盖深证指数，改用东财K线
      em_secid: "0.399006"
    - key: broker
      name: 证券ETF
      etf_track: "399975.SZ"
      csindex_code: "399975"    # 中证全指证券公司指数
      em_secid: "0.399975"
