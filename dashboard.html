<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微观指标跟踪系统</title>
<script src="assets/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
:root {
  --bg: #35445a;
  --panel: #2b394c;
  --border: #46586f;
  --text: #d8e0e8;
  --accent: #00e5ff;
  --green: #00e676;
  --red: #ff3d4f;
  --up: #ff3d4f;
  --down: #00e676;
  --yellow: #ffd740;
  --purple: #b388ff;
  --orange: #ff9100;
  /* 图表专用色 */
  --c-axis: #9aa8b8;
  --c-grid: #3d4d62;
  --c-axis-line: #46586f;
  --c-text-chart: #b0bec5;
  --c-tip-bg: rgba(43,57,76,0.96);
  --c-tip-border: #46586f;
  --c-tip-label: #1b2a3a;
  --c-blue: #1f8fff;
  --c-Gray: #8a8a8a;
}
html[data-theme="light"] {
  --bg: #eef2f7;
  --panel: #ffffff;
  --border: #d5dde8;
  --text: #2a3546;
  --accent: #0b7ea8;
  --up: #d9272e;
  --down: #0f8a3c;
  --yellow: #b8860b;
  --purple: #6b4fd8;
  --orange: #c46a00;
  --c-axis: #5b6b7f;
  --c-grid: #e3e9f0;
  --c-axis-line: #c8d3e0;
  --c-text-chart: #445468;
  --c-tip-bg: rgba(255,255,255,0.98);
  --c-tip-border: #d5dde8;
  --c-tip-label: #e6ecf3;
  --c-blue: #1667d6;
  --c-Gray: #8a94a3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  font-size: 15px;
  overflow-x: hidden;
  min-height: 100vh;
}
#particles { position:fixed; top:0; left:0; z-index:0; pointer-events:none; }
body::after {
  content:''; position:fixed; top:0; left:0; width:100%; height:100%;
  background: repeating-linear-gradient(0deg, rgba(0,229,255,0.015) 0px, transparent 2px, transparent 4px);
  pointer-events:none; z-index:999;
}
#app { position:relative; z-index:1; padding:10px 24px 30px; max-width:1600px; margin:0 auto; }
.topbar {
  position:sticky; top:0; z-index:60; background:var(--bg);
  padding-top:10px; margin-top:-10px;
}
.nfgj-bar {
  position:sticky; top:var(--topbar-h, 132px); z-index:30;
  background:var(--bg); padding:2px 0 6px;
  box-shadow:0 8px 12px -8px rgba(0,0,0,0.85);
}
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; background:var(--panel); border:1px solid var(--border);
  border-radius:10px; margin-bottom:12px;
}
.header h1 {
  font-family:'Orbitron', sans-serif; font-size:22px; color:var(--accent);
  letter-spacing:2px;
}
.header .clock { font-size:14px; color:var(--text); font-family:'Orbitron'; }
.header .actions { display:flex; gap:10px; align-items:center; }
.btn {
  padding:8px 18px; border:1px solid var(--accent); background:transparent;
  color:var(--accent); border-radius:6px; cursor:pointer; font-size:14px;
  transition:all 0.3s; font-family:inherit;
}
.btn:hover { background:var(--accent); color:#000; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
.status-dot.running { background:var(--yellow); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab {
  padding:8px 18px; border:1px solid var(--border); background:transparent;
  color:var(--text); border-radius:8px 8px 0 0; cursor:pointer; font-size:14px;
  transition:all 0.3s; border-bottom:none;
}
.tab:hover { color:var(--accent); border-color:var(--accent); }
.tab.active { background:var(--panel); color:var(--accent); border-color:var(--accent); }

.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:16px; }
.kpi-card {
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:14px 18px; transition:all 0.3s;
}
.kpi-card:hover { border-color:var(--accent); }
.kpi-label { font-size:12px; color:var(--text); text-transform:uppercase; letter-spacing:1px; }
.kpi-value { font-size:30px; font-weight:700; font-family:'Orbitron'; margin:6px 0; }
.kpi-change { font-size:14px; }
.up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--yellow); }

.chart-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(480px, 1fr)); gap:16px; margin-bottom:16px; }
.chart-panel {
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:16px; min-height:380px;
}
.chart-panel.full { grid-column:1/-1; }
.chart-title {
  font-size:15px; font-weight:600; color:var(--accent);
  margin-bottom:10px; letter-spacing:1px;
}
.chart-box { width:100%; height:360px; }

.data-table { width:100%; border-collapse:collapse; font-size:14px; }
.data-table th {
  background:rgba(0,229,255,0.08); color:var(--accent); padding:8px 10px;
  text-align:left; border-bottom:2px solid var(--border); font-weight:500; font-size:13px;
}
.data-table td { padding:8px 10px; border-bottom:1px solid rgba(30,42,58,0.5); }
.data-table tr:hover { background:rgba(0,229,255,0.04); }
.data-table .val { font-family:'Orbitron'; font-weight:600; }

.tag {
  display:inline-block; padding:3px 12px; border-radius:4px; font-size:12px;
  font-weight:600; letter-spacing:1px;
}
.tag-undervalued { background:rgba(0,230,118,0.15); color:var(--green); }
.tag-fair { background:rgba(255,215,64,0.15); color:var(--yellow); }
.tag-overvalued { background:rgba(255,61,79,0.15); color:var(--red); }
.tag-up { background:rgba(255,61,79,0.15); color:var(--up); }
.tag-down { background:rgba(0,230,118,0.15); color:var(--down); }
.tag-stable { background:rgba(255,215,64,0.15); color:var(--yellow); }

.heatmap-cell {
  display:inline-flex; align-items:center; justify-content:center;
  width:70px; height:36px; border-radius:4px; font-size:14px; font-weight:700;
  font-family:'Orbitron';
}

.fg-gauge {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:20px;
}
.fg-value { font-size:72px; font-family:'Orbitron'; font-weight:900; }
.fg-bar-wrap { width:100%; max-width:360px; height:14px; border-radius:7px;
  background:linear-gradient(to right, #ff3d4f, #ff9100, #ffd740, #ffd740, #00e676, #00e5ff);
}
.fg-bar { height:100%; border-radius:7px; background:rgba(255,255,255,0.25);
  border-right:2px solid #fff; transition:width 0.6s; }
.fg-desc { font-size:14px; }

@media (max-width:768px) {
  .chart-grid { grid-template-columns:1fr; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .header { flex-direction:column; gap:8px; }
}

.toast {
  position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:8px;
  color:#fff; font-size:13px; z-index:9999; opacity:0; transform:translateY(-20px);
  transition:all 0.4s;
}
.toast.show { opacity:1; transform:translateY(0); }
.toast.ok { background:rgba(0,230,118,0.9); }
.toast.err { background:rgba(255,61,79,0.9); }
.toast.info { background:rgba(0,229,255,0.9); }

.scroll-table { max-height:500px; overflow-y:auto; }
.scroll-table .data-table thead th {
  position:sticky; top:0; z-index:3;
  background:var(--panel);
  box-shadow:0 1px 0 var(--border);
}
.rule-btn{font-size:11px;padding:1px 8px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--dim);cursor:pointer;margin-left:8px;vertical-align:middle;white-space:nowrap}
.data-table td:first-child{white-space:nowrap}
.rule-btn:hover{color:var(--accent);border-color:var(--accent)}
.rule-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999}
.rule-mask.on{display:flex}
.rule-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 24px;max-width:560px;width:90%;line-height:1.9;font-size:14px;color:var(--text)}
.rule-card h3{margin:0 0 10px;font-size:16px;color:var(--accent)}
.rule-close{float:right;cursor:pointer;color:var(--dim);font-size:18px;line-height:1}
.sw-col{max-height:430px;overflow:auto;padding-right:4px}
.sw-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.sw-item:hover{background:rgba(255,255,255,0.05)}
.sw-item.on{background:rgba(0,229,255,0.12);color:var(--accent)}
.sw-meta{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-fresh{margin:0 0 14px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(0,0,0,0.18)),var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05)}
.tab-fresh-text{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--dim);margin-bottom:7px}
.tab-fresh-text span:last-child{font-weight:700;letter-spacing:.3px;text-shadow:0 0 10px currentColor}
.tab-fresh-track{position:relative;height:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#0a1015,#05080b);box-shadow:inset 0 2px 6px rgba(0,0,0,0.8),0 1px 0 rgba(255,255,255,0.06)}
.tab-fresh-fill{position:relative;height:100%;width:0;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,0.6),rgba(255,255,255,0) 48%),var(--bar-color);box-shadow:0 0 12px var(--bar-color),inset 0 1px 0 rgba(255,255,255,0.5),inset 0 -3px 5px rgba(0,0,0,0.35);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.tab-fresh-fill::before{content:'';position:absolute;top:0;bottom:0;left:-46px;width:40px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.65),transparent);animation:barShine 2.4s ease-in-out infinite}
.tab-fresh-fill::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0.2) 0 7px,rgba(255,255,255,0) 7px 17px);animation:barStripes 1.1s linear infinite;opacity:.65}
@keyframes barStripes{from{background-position:0 0}to{background-position:34px 0}}
@keyframes barShine{0%{left:-46px}55%,100%{left:calc(100% + 46px)}}
@media (prefers-reduced-motion:reduce){.tab-fresh-fill::before,.tab-fresh-fill::after{animation:none}}
.limit-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.62)}
.limit-modal-box{width:min(680px,94vw);max-height:82vh;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,0.65);overflow:hidden}
.limit-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.limit-modal-body{overflow:auto;padding:4px 14px 14px}
.limit-table{width:100%;border-collapse:collapse;font-size:13px}
.limit-table th,.limit-table td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}
.limit-table th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500}
.limit-stat-btn{cursor:pointer;padding:6px 16px;border:1px solid transparent;border-radius:10px;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.limit-stat-btn:hover{background:rgba(255,255,255,0.05);border-color:var(--border);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.35)}
.limit-stat-btn:active{transform:translateY(0)}
.overview-grid { display:grid; grid-template-columns:280px 1fr 1fr; gap:16px; margin-bottom:16px; }
.overview-grid .chart-panel { height:var(--kpi-h,120px); min-height:var(--kpi-h,120px); padding:8px 14px; overflow:hidden;
  display:flex; flex-direction:column; justify-content:center; }
.overview-grid .chart-title { font-size:13px; margin-bottom:4px; }
.overview-grid .fg-gauge { padding:0; gap:4px; }
.overview-grid .fg-value { font-size:34px; }
.overview-grid .fg-bar-wrap { height:8px; max-width:220px; }
.overview-grid .fg-desc { font-size:12px; }
@media (max-width:900px) { .overview-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="app">
  <div class="topbar">
  <div class="header">
    <h1>◆ 微观指标</h1>
    <div class="clock" id="clock">--</div>
    <div class="actions">
      <div class="status-dot" id="dot" title="服务状态"></div>
      <button class="btn" id="themeBtn" onclick="toggleTheme()">浅色</button>
      <span id="intradayBadge" style="display:none;font-size:12px;color:var(--orange);border:1px solid var(--orange);border-radius:10px;padding:1px 8px"></span>
      <span style="font-size:12px;color:var(--text)" id="updateLabel">就绪</span>
      <button class="btn" onclick="syncUpdate()">▲ 同步更新</button>
    </div>
  </div>

  <div id="freshBar" style="display:none;margin:0 0 10px;padding:6px 12px;border:1px solid var(--orange);border-radius:8px;color:var(--orange);font-size:13px;background:rgba(255,150,0,0.06)"></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab(0)">市场总览</button>
    <button class="tab" onclick="switchTab(1)">宽基指数</button>
    <button class="tab" onclick="switchTab(2)">风格指数</button>
    <button class="tab" onclick="switchTab(3)">行业指数</button>
    <button class="tab" onclick="switchTab(4)">情绪与资金</button>
    <button class="tab" onclick="switchTab(5)">宽基估值分位数</button>
    <button class="tab" onclick="switchTab(6)">ETF 资金跟踪</button>
  </div>
  </div>
  <div id="tabContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let w,h,ps=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<80;i++) ps.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.5,v:Math.random()*0.3+0.1});
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='rgba(0,229,255,0.15)';
    ps.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      p.y-=p.v;if(p.y<0){p.y=h;p.x=Math.random()*w;}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

let DATA = null;
const CS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('theme',t); }catch(e){}
  const b=document.getElementById('themeBtn');
  if(b) b.textContent = (t==='light') ? '深色' : '浅色';
}
function toggleTheme(){
  const t=(document.documentElement.dataset.theme==='light')?'dark':'light';
  applyTheme(t);
  if(window.DATA) renderTab();
}
let currentTab = 0;

function syncTopbarHeight(){
  const tb=document.querySelector('.topbar');
  if(!tb) return;
  document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px');
}
window.addEventListener('resize', syncTopbarHeight);

async function loadData(){
  try{
    const r=await fetch('data/analysis_trimmed.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    renderAll();
    (function(){
      const b=document.getElementById('intradayBadge');
      const ia=DATA.intraday;
      if(b&&ia&&ia.active){ b.style.display='inline'; b.textContent='盘中 '+ia.time+'（数值随行情变动）'; }
      else if(b){ b.style.display='none'; }
    })();
    (function(){
      const el=document.getElementById('freshBar');
      if(!el) return;
      const bad=(DATA.freshness||[]).filter(x=>x.status!=='ok');
      if(!bad.length){ el.style.display='none'; return; }
      el.style.display='block';
      el.textContent='数据滞后：'+bad.map(x=>x.name+'（'+(x.date||'缺失')+'）').join(' · ');
    })();
    syncTopbarHeight();
    toast('数据加载成功','ok');
  }catch(e){
    console.error('数据加载失败:', e);
    toast('数据加载失败，请先运行数据更新','err');
    showEmptyState();
  }
}

function showEmptyState(){
  document.getElementById('tabContent').innerHTML =
    '<div style="text-align:center;padding:80px 20px;color:var(--text)">'+
    '<div style="font-size:48px;margin-bottom:20px">&#9888;</div>'+
    '<div style="font-size:18px;margin-bottom:10px">暂无数据</div>'+
    '<div style="font-size:13px;color:var(--c-axis)">请点击右上角"▲ 同步更新"按钮获取最新数据</div>'+
    '</div>';
}

function changeColor(v){ return v>0?CS('--up'):v<0?CS('--down'):CS('--yellow'); }

function initChart(domId){
  const dom=document.getElementById(domId);
  if(!dom) return null;
  const c=echarts.init(dom);
  c.setOption({backgroundColor:'transparent'});
  return c;
}

function makeLineChart(domId, series, title, grid){
  const dom=document.getElementById(domId);
  if(!dom||!series.length) return;
  const c=echarts.init(dom);
  const colors=[CS('--accent'),CS('--orange'),CS('--down'),CS('--up'),CS('--purple'),CS('--yellow'),'#40c4ff','#ff6e40','#69f0ae','#ff80ab'];
  c.setOption({
    tooltip:{trigger:'axis'},
    legend:{bottom:0,textStyle:{color:CS('--c-text-chart'),fontSize:10},data:series.map(s=>s.name)},
    grid:grid||{left:60,right:30,top:30,bottom:50},
    xAxis:(function(){
      const xs=[];
      series.forEach(s=>(s.data||[]).forEach(p=>{if(Array.isArray(p)&&p[0]) xs.push(p[0]);}));
      const mn=xs.length?xs.reduce((a,b)=>a<b?a:b):null;
      const mx=xs.length?xs.reduce((a,b)=>a>b?a:b):null;
      return {type:'time',min:mn,max:mx,splitNumber:8,
        axisLine:{lineStyle:{color:CS('--c-axis-line')}},
        axisLabel:{color:CS('--c-axis'),hideOverlap:false}};
    })(),
    yAxis:{type:'value',name:title||'',splitLine:{lineStyle:{color:CS('--c-axis-line')}}},
    series:series.map((s,i)=>{
      const col=(s.lineStyle&&s.lineStyle.color)||colors[i%colors.length];
      const fewPts=Array.isArray(s.data)&&s.data.length<=30;
      return {...s,type:'line',smooth:true,showSymbol:fewPts,symbolSize:5,
        lineStyle:{...(s.lineStyle||{}),color:col,width:(s.lineStyle&&s.lineStyle.width)||2},
        itemStyle:{...(s.itemStyle||{}),color:col}};
    }),
  });
  window.addEventListener('resize',()=>c.resize());
}

function makeBarChart(domId, names, values, title){
  const dom=document.getElementById(domId);
  if(!dom||!names.length) return;
  const c=echarts.init(dom);
  c.setOption({
    tooltip:{trigger:'axis'},
    grid:{left:80,right:30,top:30,bottom:60},
    xAxis:{type:'category',data:names,axisLabel:{rotate:45,fontSize:9,color:CS('--c-text-chart')}},
    yAxis:{type:'value',name:title,splitLine:{lineStyle:{color:CS('--c-axis-line')}}},
    series:[{type:'bar',data:values.map(v=>({value:v,itemStyle:{color:v>=0?CS('--up'):CS('--down')}})),barMaxWidth:30}],
  });
  window.addEventListener('resize',()=>c.resize());
}

function makeMultiBarChart(domId, names, seriesNames, seriesData){
  const dom=document.getElementById(domId);
  if(!dom||!names.length) return;
  const c=echarts.init(dom);
  const colors=[CS('--accent'),CS('--orange'),CS('--purple')];
  c.setOption({
    tooltip:{trigger:'axis'},
    legend:{bottom:0,textStyle:{color:CS('--c-text-chart')}},
    grid:{left:80,right:30,top:30,bottom:50},
    xAxis:{type:'category',data:names,axisLabel:{rotate:45,fontSize:9,color:CS('--c-text-chart')}},
    yAxis:{type:'value',name:'%',splitLine:{lineStyle:{color:CS('--c-axis-line')}}},
    series:seriesData.map((data,i)=>({name:seriesNames[i],type:'bar',data,barMaxWidth:24,itemStyle:{color:colors[i]}})),
  });
  window.addEventListener('resize',()=>c.resize());
}

function switchTab(idx){
  currentTab=idx;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  renderTab();
}

function renderAll(){
  updateClock();
  renderTab();
}

function renderTab(){
  if(!DATA){ showEmptyState(); return; }
  const fns=[renderMarketOverview, renderBroadIndices, renderStyleIndices,
             renderIndustryIndices, renderSentiment, renderETFValuation, renderNfgj];
  const content=document.getElementById('tabContent');
  if(window._rtTimer){ clearInterval(window._rtTimer); window._rtTimer=null; }
  window.scrollTo(0,0);
  content.innerHTML='';
  fns[currentTab]();
  renderTabFreshness();
  setTimeout(initAllCharts,100);
}

function renderTabFreshness(){
  const tf=DATA&&DATA.tab_freshness, t=tf&&(tf.tabs||[])[currentTab];
  if(!t) return;
  const total=t.total||0, ok=t.ok||0, pct=total?Math.round(ok/total*100):0;
  const full=total>0&&ok===total;
  const color=full?'var(--accent)':'var(--orange)';
  const text=total?(full?`全部更新至 ${t.latest}`:`部分更新至 ${t.latest}（${ok}/${total}）`):'暂无更新数据';
  const parts=(t.parts||[]).map(p=>`${p.name} ${p.date||'缺失'}`).join(' · ');
  const el=document.createElement('div');
  el.className='tab-fresh';
  el.title=parts;
  el.innerHTML=`<div class="tab-fresh-text"><span>数据更新进度</span><span style="color:${color}">${text}</span></div><div class="tab-fresh-track"><div class="tab-fresh-fill" style="--bar-color:${color}"></div></div>`;
  const c=document.getElementById('tabContent');
  if(c) c.insertBefore(el,c.firstChild);
  requestAnimationFrame(()=>{const f=el.querySelector('.tab-fresh-fill'); if(f) f.style.width=pct+'%';});
}

async function showLimitDetail(kind){
  let d=null;
  try{
    const r=await fetch('data/limit_details.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok) d=await r.json();
  }catch(e){}
  if(!d) d=(DATA.market_breadth||{}).limit_details||{};
  const rows=(kind==='up'?d.up:d.down)||[];
  const title=kind==='up'?'涨停明细':'跌停明细';
  const body=rows.length
    ?`<table class="limit-table"><thead><tr><th>名称</th><th>代码</th><th>板块</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.code}</td><td>${r.industry||r.board||'--'}</td></tr>`).join('')}</tbody></table>`
    :'<div style="padding:24px;color:var(--dim)">暂无明细数据，请重新采集市场宽度</div>';
  let m=document.getElementById('limitModal');
  if(!m){m=document.createElement('div');m.id='limitModal';m.className='limit-modal';document.body.appendChild(m);}
  m.innerHTML=`<div class="limit-modal-box"><div class="limit-modal-head"><span>${title}（${rows.length}）<span style="font-size:12px;color:var(--dim);margin-left:8px">${d.date||''}</span></span><button class="rule-btn" onclick="closeLimitDetail()">关闭</button></div><div class="limit-modal-body">${body}</div></div>`;
  m.style.display='flex';
  m.onclick=e=>{if(e.target===m) closeLimitDetail();};
}
function closeLimitDetail(){const m=document.getElementById('limitModal'); if(m) m.style.display='none';}

function initAllCharts(){
  if(!DATA) return;
  switch(currentTab){
    case 0: initMarketCharts(); break;
    case 1: initBroadCharts(); break;
    case 2: initStyleCharts(); break;
    case 3: initIndustryCharts(); break;
    case 4: initSentimentCharts(); break;
    case 5: initETFCharts(); break;
    case 6: initNfgjCharts(); break;
  }
}

const CC_METRICS=[['kline','K线'],['close','收盘价'],['chg','日涨跌幅(%)'],['ma5','MA5'],['ma10','MA10'],['ma20','MA20'],['ma60','MA60'],['ma250','MA250'],['boll','布林带'],['bias','乖离率(MA250)'],['atr','ATR14'],['hv','HV20(%)'],['rsi','RSI14']];
const CC_SUBS=[['vol','成交量'],['macd','MACD'],['rsi','RSI14'],['chg','日涨跌幅(%)']];
let ccState={idx:null,range:'1y',m1:'kline',m2:'ma20',m3:'',s1:'vol',s2:'macd'};
let bcState={idx:null,range:'1y',m1:'kline',m2:'ma20',m3:'',s1:'vol',s2:'macd'};
function ccUpdate(k,v){ const isB=k.indexOf('bc')===0; const key=k.replace(/^(cc|bc)/,'').toLowerCase(); const map={idx:'idx',range:'range',m1:'m1',m2:'m2',m3:'m3',s1:'s1',s2:'s2'}; const st=isB?bcState:ccState; st[map[key]||key]=v; if(isB) renderBroadCustomChart(); else renderCustomChart(); }
function ccMA(a,n){ const out=new Array(a.length).fill(null); let sum=0;
  for(let i=0;i<a.length;i++){ sum+=a[i]; if(i>=n) sum-=a[i-n]; if(i>=n-1) out[i]=+(sum/n).toFixed(2); } return out; }
function ccEMA(a,n){ const k=2/(n+1); let e=null; return a.map(v=>{ e=e==null?v:v*k+e*(1-k); return e; }); }
function ccMACD(close){ const e12=ccEMA(close,12), e26=ccEMA(close,26);
  const dif=close.map((_,i)=>e12[i]-e26[i]); const dea=ccEMA(dif,9);
  const hist=dif.map((v,i)=>+(2*(v-dea[i])).toFixed(3));
  return {dif:dif.map(v=>+v.toFixed(3)),dea:dea.map(v=>+v.toFixed(3)),hist}; }
function ccBoll(close,n){ n=n||20; const mid=ccMA(close,n); const up=[],lo=[];
  const out=close.map((_,i)=>{ if(i<n-1||mid[i]==null) return [null,null,null];
    let s2=0; for(let j=i-n+1;j<=i;j++){ const d=close[j]-mid[i]; s2+=d*d; }
    const sd=Math.sqrt(s2/n); return [ +(mid[i]+2*sd).toFixed(2), +mid[i].toFixed(2), +(mid[i]-2*sd).toFixed(2) ]; });
  return {up:out.map(x=>x[0]), mid:out.map(x=>x[1]), low:out.map(x=>x[2])}; }
function ccATR(ts,n){ n=n||14; const out=new Array(ts.length).fill(null); let prev=null;
  for(let i=0;i<ts.length;i++){ const h=ts[i].high, l=ts[i].low, c=ts[i].value;
    if(h==null||l==null){ out[i]=prev; continue; }
    const pc = i? ts[i-1].value : c;
    const tr = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
    prev = prev==null ? tr : (prev*(n-1)+tr)/n;
    out[i]= +(prev).toFixed(2); }
  return out; }
function ccHV(close,n){ n=n||20; const out=new Array(close.length).fill(null);
  for(let i=n;i<close.length;i++){ let sum=0, sum2=0;
    for(let j=i-n+1;j<=i;j++){ const r=Math.log(close[j]/close[j-1]); sum+=r; sum2+=r*r; }
    const v=sum2/n-(sum/n)*(sum/n); out[i]= +(Math.sqrt(Math.max(v,0))*Math.sqrt(252)*100).toFixed(2); }
  return out; }
function ccRSI(a,n){ const out=new Array(a.length).fill(null);
  if(a.length<=n) return out;
  let g=0,l=0;
  for(let i=1;i<=n;i++){ const d=a[i]-a[i-1]; if(d>=0) g+=d; else l-=d; }
  let ag=g/n, al=l/n;
  out[n]=al===0?100:+(100-100/(1+ag/al)).toFixed(2);
  for(let i=n+1;i<a.length;i++){ const d=a[i]-a[i-1];
    ag=(ag*(n-1)+Math.max(d,0))/n; al=(al*(n-1)+Math.max(-d,0))/n;
    out[i]=al===0?100:+(100-100/(1+ag/al)).toFixed(2); }
  return out; }
function ccSeries(ind,key){
  const ts=ind.ts_data||[], close=ts.map(p=>p.value);
  const one=(label,data,axis,color)=>[{label,data,axis,color}];
  if(key==='close') return one('收盘价',close,0);
  if(key==='chg') return one('日涨跌幅(%)',close.map((v,i)=>i? +((v-close[i-1])/close[i-1]*100).toFixed(2):null),1);
  if(key==='rsi') return one('RSI14',ccRSI(close,14),1);
  if(key==='bias'){ const m=ccMA(close,250);
    return one('乖离率MA250(%)', close.map((v,i)=> m[i]? +((v-m[i])/m[i]*100).toFixed(2):null),1); }
  if(key==='atr') return one('ATR14',ccATR(ts,14),1);
  if(key==='hv') return one('HV20(%)',ccHV(close,20),1);
  if(key==='boll'){ const b=ccBoll(close,20);
    return [{label:'BOLL上',data:b.up,axis:0,color:'#78909c'},
            {label:'BOLL中',data:b.mid,axis:0,color:'#b0bec5'},
            {label:'BOLL下',data:b.low,axis:0,color:'#78909c'}]; }
  const n=parseInt(key.replace('ma',''),10);
  return one('MA'+n,ccMA(close,n),0);
}
function renderCustomCharts(prefix, st, list, chartId){
  const mi=list||[]; if(!mi.length) return;
  const dom=document.getElementById(chartId); if(!dom) return;
  const sel=(id,val)=>{ const e=document.getElementById(id); if(e) e.value=val; };
  [prefix+'M1',prefix+'M2',prefix+'M3'].forEach(id=>{
    const e=document.getElementById(id);
    if(e && !e.options.length){
      e.innerHTML='<option value="">（无）</option>'+CC_METRICS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');
    }
  });
  [prefix+'S1',prefix+'S2'].forEach(id=>{
    const e=document.getElementById(id);
    if(e && !e.options.length){
      e.innerHTML='<option value="">（无）</option>'+CC_SUBS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');
    }
  });
  if(!st.idx || !mi.some(x=>x.name===st.idx)) st.idx=mi[0].name;
  sel(prefix+'Idx',st.idx); sel(prefix+'Range',st.range);
  sel(prefix+'M1',st.m1); sel(prefix+'M2',st.m2); sel(prefix+'M3',st.m3);
  sel(prefix+'S1',st.s1); sel(prefix+'S2',st.s2);

  const ind=mi.find(x=>x.name===st.idx);
  const ts=ind.ts_data||[]; const dates=ts.map(p=>p.date);
  const N={'1m':22,'3m':66,'6m':120,'1y':250,'3y':750,'all':dates.length}[st.range]||250;
  const start=Math.max(0, dates.length-N);
  const cutDates=dates.slice(start);
  const close=ts.map(p=>p.value);
  const vol=ts.map(p=>p.vol!=null?+(p.vol/1e8).toFixed(2):null);
  const hasOHLC=ts.length>0 && ts[0].open!=null && ts[0].high!=null && ts[0].low!=null;
  const palette=[CS('--accent'),CS('--orange'),'#b388ff'];
  const series=[];

  // 主图
  const keys=[st.m1,st.m2,st.m3].filter((v,i,arr)=>v&&arr.indexOf(v)===i);
  const hasRight=keys.some(k=>['rsi','chg','bias','atr','hv'].includes(k));
  keys.forEach((k,i)=>{
    if(k==='kline' && hasOHLC){
      series.push({name:'K线',type:'candlestick',xAxisIndex:0,yAxisIndex:0,barMaxWidth:9,
        itemStyle:{color:CS('--up'),color0:CS('--down'),borderColor:CS('--up'),borderColor0:CS('--down')},
        data:ts.slice(start).map(p=>[p.open,p.value,p.low,p.high])});
      return;
    }
    const arr=ccSeries(ind,k);
    arr.forEach((m,mi)=>{
      const color=m.color||palette[(i+mi)%3];
      series.push({name:m.label,type:'line',smooth:true,showSymbol:false,xAxisIndex:0,
        yAxisIndex:m.axis===1?1:0,lineStyle:{color,width:m.color?1.2:1.8},
        itemStyle:{color},data:m.data.slice(start)});
    });
  });

  // 副图
  function subSeries(key, xIdx){
    if(!key) return [];
    if(key==='vol'){
      return [{name:'成交量/额(亿)',type:'bar',xAxisIndex:xIdx,barMaxWidth:6,
        itemStyle:{color:(p)=>{const gi=start+p.dataIndex;return (gi>0 && close[gi]>=close[gi-1])?CS('--up'):CS('--down');}},
        data:vol.slice(start)}];
    }
    if(key==='chg'){
      return [{name:'日涨跌幅(%)',type:'bar',xAxisIndex:xIdx,barMaxWidth:6,
        itemStyle:{color:(p)=>((p.value||0)>=0?CS('--up'):CS('--down'))},
        data:close.slice(start).map((v,i)=>{const gi=start+i;return gi?+((v-close[gi-1])/close[gi-1]*100).toFixed(2):null;})}];
    }
    if(key==='rsi'){
      return [{name:'RSI14',type:'line',smooth:true,showSymbol:false,xAxisIndex:xIdx,
        lineStyle:{color:'#b388ff',width:1.5},itemStyle:{color:'#b388ff'},data:ccRSI(close,14).slice(start)}];
    }
    if(key==='macd'){
      const m=ccMACD(close);
      return [
        {name:'MACD柱',type:'bar',xAxisIndex:xIdx,barMaxWidth:5,
         itemStyle:{color:(p)=>((p.value||0)>=0?CS('--up'):CS('--down'))},data:m.hist.slice(start)},
        {name:'DIF',type:'line',xAxisIndex:xIdx,showSymbol:false,
         lineStyle:{color:CS('--accent'),width:1.2},itemStyle:{color:CS('--accent')},data:m.dif.slice(start)},
        {name:'DEA',type:'line',xAxisIndex:xIdx,showSymbol:false,
         lineStyle:{color:CS('--orange'),width:1.2},itemStyle:{color:CS('--orange')},data:m.dea.slice(start)}
      ];
    }
    return [];
  }
  const hasSub1=!!st.s1, hasSub2=!!st.s2;
  if(hasSub1) subSeries(st.s1,1).forEach((x,i)=>{x.yAxisIndex=2;series.push(x);});
  if(hasSub2) subSeries(st.s2,2).forEach((x,i)=>{x.yAxisIndex=3;series.push(x);});

  const grids=[], xAxes=[], yAxes=[];
  const L=64, R=hasRight?60:30;
  const layout = hasSub1&&hasSub2 ? {m0:[52,'40%'],m1:['58%','13%'],m2:['76%','13%']}
               : hasSub1 ? {m0:[52,'54%'],m1:['72%','16%']}
               : {m0:[52,'70%']};
  grids.push({left:L,right:R,top:layout.m0[0],height:layout.m0[1]});
  xAxes.push({type:'category',gridIndex:0,data:cutDates,axisLine:{lineStyle:{color:CS('--c-axis-line')}},
    axisLabel:{color:CS('--c-axis'),show:!hasSub1},axisTick:{show:!hasSub1}});
  yAxes.push({type:'value',gridIndex:0,scale:true,axisLabel:{color:CS('--c-axis')},splitLine:{lineStyle:{color:CS('--c-grid')}}});
  yAxes.push({type:'value',show:hasRight,scale:true,gridIndex:0,axisLabel:{color:CS('--c-axis')},splitLine:{show:false}});
  if(hasSub1){
    grids.push({left:L,right:R,top:layout.m1[0],height:layout.m1[1]});
    xAxes.push({type:'category',gridIndex:1,data:cutDates,axisLine:{lineStyle:{color:CS('--c-axis-line')}},
      axisLabel:{color:CS('--c-axis'),show:!hasSub2},axisTick:{show:!hasSub2}});
    yAxes.push({type:'value',gridIndex:1,scale:true,splitNumber:2,axisLabel:{color:CS('--c-axis')},splitLine:{show:false}});
  }
  if(hasSub2){
    grids.push({left:L,right:R,top:layout.m2[0],height:layout.m2[1]});
    xAxes.push({type:'category',gridIndex:2,data:cutDates,axisLine:{lineStyle:{color:CS('--c-axis-line')}},
      axisLabel:{color:CS('--c-axis')},axisTick:{}});
    yAxes.push({type:'value',gridIndex:2,scale:true,splitNumber:3,axisLabel:{color:CS('--c-axis')},splitLine:{show:false}});
  }

  const c=echarts.getInstanceByDom(dom)||echarts.init(dom);
  c.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
    axisPointer:{link:[{xAxisIndex:'all'}]},
    legend:{top:0,type:'scroll',itemGap:10,textStyle:{color:CS('--c-text-chart')}},
    grid:grids, xAxis:xAxes, yAxis:yAxes, series:series
  }, true);
  window.addEventListener('resize',()=>c.resize());
}

let swSel={l1:null,l2:null};
function pickSwL1(code){ swSel.l1=code; swSel.l2=null; renderSwCols(); }
function pickSwL2(code){ swSel.l2=code; renderSwCols(); }
function _swChg(it){ return it.chg_stock!=null?it.chg_stock:it.chg; }
function _swSort(items){ return [...items].sort((a,b)=>{const x=_swChg(a),y=_swChg(b);return (y==null?-999:y)-(x==null?-999:x);}); }
function _swRow(it,on,fn,childLabel){
  const ch=_swChg(it), cls=ch>0?'up':ch<0?'down':'flat';
  const n=it.n_stocks!=null?it.n_stocks:'--';
  const lu=it.limit_up!=null?it.limit_up:'--';
  const ld=it.limit_down!=null?it.limit_down:'--';
  const child=(it.n_children&&childLabel)?`${it.n_children} ${childLabel} · `:'';
  const attrs=fn?` onclick="${fn}('${it.code}')"`:' style="cursor:default"';
  return `<div class="sw-item${on?' on':''}"${attrs}><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.name}</span><span class="${cls}" style="font-family:Orbitron;font-size:12px">${ch!=null?(ch>0?'+':'')+ch.toFixed(2)+'%':'--'}</span></div><div class="sw-meta">${child}${n} 家 · 涨停 ${lu} · 跌停 ${ld}</div></div></div>`;
}
function renderSwCols(){
  const t=DATA.sw_tree; if(!t) return;
  const l1=document.getElementById('swL1'), l2=document.getElementById('swL2'), l3=document.getElementById('swL3');
  if(!l1) return;
  if(!swSel.l1 && t.l1.length) swSel.l1=_swSort(t.l1)[0].code;
  const selL1=t.l1.find(x=>x.code===swSel.l1)||_swSort(t.l1)[0];
  l1.innerHTML=_swSort(t.l1).map(x=>_swRow(x,x.code===swSel.l1,'pickSwL1','二级')).join('');
  const l2s=_swSort(t.l2.filter(x=>x.parent===selL1.name));
  l2.innerHTML=l2s.length?l2s.map(x=>_swRow(x,x.code===swSel.l2,'pickSwL2','三级')).join(''):'<div style="color:var(--dim);padding:8px">暂无二级数据</div>';
  const selL2=t.l2.find(x=>x.code===swSel.l2&&x.parent===selL1.name);
  const l3s=selL2?_swSort(t.l3.filter(x=>x.parent===selL2.name)):[];
  l3.innerHTML=selL2?(l3s.length?l3s.map(x=>_swRow(x,false,'','')).join(''):'<div style="color:var(--dim);padding:8px">暂无三级数据</div>'):'<div style="color:var(--dim);padding:8px">请选择二级行业</div>';
}

function initSentimentCharts(){

        areaStyle:{color,opacity:0.55},lineStyle:{color,width:0.8},itemStyle:{color},
        data:pc.ts_data.map(p=>({value:p[key],amt:p[amtKey],d:p.d_total_amt}))});
      const cs=echarts.init(domS);

            let out=arr.length?arr[0].axisValue:'';

        areaStyle:{color,opacity:0.55},lineStyle:{color,width:0.8},itemStyle:{color},
        data:caps.map(p=>({value:p[key],amt:p[mvKey],d:p.d_total_mv}))});
      const cc=echarts.init(domC);
      cc.setOption({

          formatter:ps=>{
            const arr=ps.slice().reverse();

            let sumHs=0, sumAll=0;
            arr.forEach(p=>{
              const d=p.data, v=(d&&typeof d==='object')?d.value:p.value;
              const amt=(d&&typeof d==='object')?d.amt:null;
              out+='<br/>'+p.marker+p.seriesName+': '+(v==null?'--':Number(v).toFixed(2)+'%')
                  +(amt!=null?'（'+Math.round(amt).toLocaleString()+' 亿）':'');

        legend:{top:0,textStyle:{color:CS('--c-text-chart'),fontSize:11}},
        grid:{left:56,right:20,top:36,bottom:40},
        xAxis:{type:'category',data:dts,
          axisLabel:{color:CS('--c-axis'),fontSize:10,formatter:v=>String(v).slice(0,7)},
          axisLine:{lineStyle:{color:CS('--c-axis-line')}}},

          splitLine:{lineStyle:{color:CS('--c-grid')}}},

          mk2('北交所','bj','bj_mv','#c08b2e'),
        ],
      });
      window.addEventListener('resize',()=>cc.resize());
    }
  }

  // Market Crowding trend chart
  const cr=DATA.market_crowding||{};

  const mt2=(DATA.sentiment||{}).margin_tracking;
  if(mt2&&mt2.ts_data&&document.getElementById('chart_margin_track_main')){

function renderETFValuation(){

  let html='<div class="chart-grid">';
  html+='<div class="chart-panel"><div class="chart-title">PE 历史分位 (5年)</div><div class="chart-box" id="chart_pe_pct"></div></div>';
  html+='<div class="chart-panel"><div class="chart-title">PE_TTM 当前值</div><div class="chart-box" id="chart_pe_val"></div></div>';

  html+='<div class="chart-grid" style="grid-template-columns:1fr"><div class="chart-panel full"><div class="chart-title">宽基估值分位汇总</div><div class="scroll-table"><table class="data-table"><thead><tr><th>指数</th><th>PE_TTM</th><th>PE分位(5年)</th><th>PE分位(10年)</th><th>PE分位(全历史)</th><th>估值水平</th><th>PB</th><th>PB分位</th></tr></thead><tbody>';
  val.forEach(v=>{
    const lvl=v.pe_level||'--', tagCls=lvl==='低估'?'tag-undervalued':lvl==='高估'?'tag-overvalued':'tag-fair';
    html+=`<tr><td><b>${v.name}</b></td><td class="val">${v.pe_ttm!=null?v.pe_ttm.toFixed(2):'--'}</td><td>${v.pe_pct_5y!=null?v.pe_pct_5y.toFixed(1)+'%':'--'}</td><td>${v.pe_pct_10y!=null?v.pe_pct_10y.toFixed(1)+'%':'--'}</td><td>${v.pe_pct_all!=null?v.pe_pct_all.toFixed(1)+'%':'--'}</td><td><span class="tag ${tagCls}">${lvl}</span></td><td>${v.pb!=null?v.pb.toFixed(2):'--'}</td><td>${v.pb_pct_all!=null?v.pb_pct_all.toFixed(1)+'%':'--'}</td></tr>`;
  });
  html+='</tbody></table></div></div></div>';

  html+='<div class="chart-grid" style="grid-template-columns:1fr"><div class="chart-panel full"><div class="chart-title">PE_TTM 历史走势</div><div class="chart-box" id="chart_pe_trend"></div></div></div>';

  document.getElementById('tabContent').innerHTML=html;
}

let sentRange = 'all';

let nfgjIdx = 0;
let nfgjRange = 'all';
function pickNfgj(i){ nfgjIdx=i; renderTab(); }
function pickNfgjRange(r){ nfgjRange=r; renderTab(); }

function fmtYi(v){
  if(v==null || isNaN(v)) return '--';
  const a=Math.abs(v);
  if(a>=10000) return (v/10000).toFixed(2)+' 万亿';
  return v.toFixed(0)+' 亿';
}
function fmtSigned(v){
  if(v==null || isNaN(v)) return '--';
  return (v>0?'+':'')+fmtYi(v);
}

function renderNfgj(){
  const box=DATA.nfgj||{}, items=box.items||[];
  if(!items.length){
    document.getElementById('tabContent').innerHTML =
      '<div style="text-align:center;padding:60px;color:var(--text)">暂无 ETF 资金跟踪数据，请先同步更新</div>';
    return;
  }
  if(nfgjIdx>=items.length) nfgjIdx=0;
  const cur=items[nfgjIdx], L=cur.latest||{};

  let html='<div class="nfgj-bar">';
  html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">';
  items.forEach((it,i)=>{
    const on=(i===nfgjIdx);
    html+=`<button class="tab" style="border-radius:8px;white-space:nowrap;${on?'background:rgba(0,229,255,0.12);color:var(--accent);border-color:var(--accent);':''}" onclick="pickNfgj(${i})">${it.name}</button>`;
  });
  html+='</div>';

  const RANGES=[['1d','当日'],['1w','近一周'],['1m','近一月'],['6m','近6月'],['1y','近1年'],['3y','近3年'],['5y','近5年'],['all','全部']];
  html+='<div style="display:flex;gap:6px;align-items:center;margin:0;flex-wrap:wrap;row-gap:6px">';
  html+='<span style="color:var(--dim);font-size:12px;margin-right:4px;white-space:nowrap">时间区间</span>';
  RANGES.forEach(([k,label])=>{
    const on=(nfgjRange===k);
    html+=`<button class="tab" style="border-radius:6px;padding:4px 12px;font-size:12px;white-space:nowrap;${on?'background:rgba(0,229,255,0.12);color:var(--accent);border-color:var(--accent);':''}" onclick="pickNfgjRange('${k}')">${label}</button>`;
  });
  html+='</div></div>';

  if(nfgjRange==='1d'){
    html+='<div id="rtWrap" style="height:calc(100vh - var(--topbar-h,132px) - 20px);min-height:380px;display:flex;flex-direction:column;overflow-y:auto">'
        +'<div id="rtSnapshot" class="chart-panel full" style="flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 18px;overflow:hidden">正在加载实时快照…</div></div>';
    document.getElementById('tabContent').innerHTML=html;
    loadRealtime();
    if(window._rtTimer) clearInterval(window._rtTimer);
    window._rtTimer=setInterval(loadRealtime,60000);
    return;
  }

  const pctColor=L.pct>=1.5?'var(--red)':L.pct>=0.8?'var(--orange)':'var(--green)';
  const stat=(label,val,sub,color)=>'<div style="display:flex;flex-direction:column;gap:2px;min-width:128px">'
    +'<span style="font-size:11px;color:var(--dim)">'+label+'</span>'
    +'<span style="font-size:19px;font-family:Orbitron,monospace;font-weight:600;color:'+(color||'var(--text)')+'">'+val+'</span>'
    +'<span style="font-size:11px;color:var(--dim)">'+(sub||'')+'</span></div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-start;'
    +'padding:4px 0 6px;margin-bottom:6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">';
  const _ts=(cur.ts||[]).filter(p=>p.pct!=null);
  const _rank=_ts.length?Math.round(_ts.filter(p=>p.pct<=L.pct).length/_ts.length*100):null;
  html+=stat(cur.name.replace(/ETF$/,'')+'ETF / 流通市值', L.pct!=null?L.pct.toFixed(3)+'%':'--',
             '流通市值 '+cur.float_mv_wanyi+' 万亿 · '+cur.n_etf+' 只 ETF'
             +(_rank!=null?' · 占比历史 '+_rank+'% 分位':''), pctColor);
  html+=stat('ETF 总规模', fmtYi(L.etf_mv_yi),
             '当日成交 '+fmtYi(L.etf_amt)+'（'+fmtSigned(L.amt_diff)+'）');
  html+=stat('20日折算净申购', fmtSigned(L.net20_yi),
             '斜率 '+(L.d20!=null?L.d20.toFixed(3)+'pp':'--')+' · 系数 '+cur.conv_yi_per_pp+' 亿/pp',
             (L.net20_yi||0)>=0?'var(--up)':'var(--down)');
  html+=stat('60日折算净申购', fmtSigned(L.net60_yi),
             '斜率 '+(L.d60!=null?L.d60.toFixed(3)+'pp':'--')+' · '+(L.date||''),
             (L.net60_yi||0)>=0?'var(--up)':'var(--down)');
  html+='</div>';

  // 份额是交易所日终披露：标注最新可用日期，当日未出时明确提示
  (function(){
    const d=String(L.date||'');
    const nums=d.match(/^(\d{4})(\d{2})(\d{2})$/);
    const shown=nums?`${nums[1]}-${nums[2]}-${nums[3]}`:d;
    const now=new Date();
    const today=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const stale=d && d<today;
    html+='<div style="font-size:12px;color:var(--c-axis);margin:-2px 0 10px;line-height:1.7">'
      +'份额数据截至 '+shown
      +(stale?'　·　当日份额尚未披露（交易所通常 21:00 后陆续更新，届时会自动补采）':'')
      +'</div>';
  })();

  // 强制一屏：四图按比例占满剩余高度（矮窗口自动压缩、隐藏部分刻度）
  const fit=true;
  const panel=(id,title,flexOrH)=>{
    if(fit){
      return '<div class="chart-panel full" style="flex:'+flexOrH+' 1 0;min-height:0;margin:0;padding:2px 6px 4px;display:flex;flex-direction:column;overflow:hidden">'
        +'<div class="chart-title" style="flex:0 0 auto;font-size:12px;padding:1px 0;margin:0">'+title+'</div>'
        +'<div class="chart-box" style="flex:1 1 auto;height:auto;min-height:50px" id="'+id+'"></div></div>';
    }
    return '<div class="chart-panel full" style="margin:0">'
      +'<div class="chart-title">'+title+'</div>'
      +'<div class="chart-box" style="height:'+flexOrH+'px" id="'+id+'"></div></div>';
  };
  html+='<div id="nfgjWrap" data-fit="'+(fit?1:0)+'" style="display:flex;flex-direction:column;gap:8px">';
  html+=panel('chart_nfgj_main', cur.name.replace(/ETF$/,'')+'ETF 资金跟踪：总市值 / 流通市值，及其斜率', fit?2.4:400);
  html+=panel('chart_nfgj_d20','斜率：20 个交易日的比值变化 → 折算净申购金额', fit?1.15:200);
  html+=panel('chart_nfgj_d60','斜率：60 个交易日的比值变化 → 折算净申购金额', fit?1.15:200);
  html+=panel('chart_nfgj_mv', cur.n_etf+' 只'+cur.name+' ETF 合计规模（份额 × 收盘价）', fit?0.95:220);
  html+='</div>';

  // 解读/分桶跟随所选区间（当日、近一周样本太短，回退到近一月）
  const rk=(nfgjRange==='1d'||nfgjRange==='1w')?'1m':nfgjRange;
  const bkMap=((DATA.nfgj||{}).buckets||{})[cur.key]||{};
  const bkSel=bkMap[rk];
  const rangeTxt=(nfgjRange==='1d'||nfgjRange==='1w')?'近一月':({ '1m':'近一月','6m':'近6月','1y':'近1年','3y':'近3年','5y':'近5年','all':'全部' }[nfgjRange]||'');
  if(bkSel){
    html+='<div class="chart-panel full" style="margin-top:10px"><div class="chart-title">20 日净申购分桶 → 未来收益（'+cur.name+' · '+rangeTxt+'；纯色=日频样本，斜纹=去重叠样本）</div>'
        +'<div class="chart-box" style="height:340px" id="chart_nfgj_bucket"></div></div>';
  }

  const narMap=((DATA.nfgj||{}).narratives||{})[cur.key]||{};
  const nar=narMap[rk]||narMap['all'];
  if(nar && nar.items){
    const tc=t=>t==='up'?'var(--up)':t==='down'?'var(--down)':'var(--accent)';
    const fdate=s=>s?String(s).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3'):'';
    html+='<div class="chart-panel full" style="margin-top:10px">'
      +'<div class="chart-title" style="display:flex;justify-content:space-between;align-items:center">'
      +'<span>数据解读（'+cur.name+' · '+rangeTxt+'区间 · '+fdate(nar.start)+' ~ '+fdate(nar.end)+'）</span>'
      +'<span style="font-size:13px;padding:3px 12px;border-radius:12px;border:1px solid '+tc(nar.tone)
      +';color:'+tc(nar.tone)+'">'+nar.state+'</span></div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;padding:4px 0 6px">';
    // 主流宽基合计（本轮增持 / 距峰值）
    (function(){
      const eps=(DATA.nfgj||{}).episodes||{};
      const list=((DATA.nfgj||{}).items||[]).filter(i=>i.key!=='broker').map(i=>eps[i.key]).filter(Boolean);
      if(!list.length) return;
      const sum=k=>list.reduce((a,e)=>a+(e[k]||0),0);
      const add=sum('added_yi'), gap=sum('gap_yi'), peak=sum('peak_yi'), now=sum('now_yi');
      const gapPct=peak?-(gap/peak*100):0;
      const hs=eps['hs300'], share=(add&&hs)?(hs.added_yi/add*100):null;
      let t=list.length+' 个宽基（不含证券ETF）本轮合计增持约 '+Math.round(add).toLocaleString()+' 亿元';
      if(share!=null) t+='（其中沪深300 占 '+share.toFixed(0)+'%）';
      t+='；当前合计规模 '+Math.round(now).toLocaleString()+' 亿元，距各自历史峰值合计 '
        +Math.round(peak).toLocaleString()+' 亿元还差 '+Math.round(gap).toLocaleString()
        +' 亿元（合计较峰值 '+gapPct.toFixed(0)+'%）。';
      html+='<div style="grid-column:1/-1;border-left:3px solid var(--accent);background:rgba(0,229,255,0.06);'
        +'padding:12px 14px;border-radius:6px">'
        +'<div style="font-size:14px;color:var(--c-axis);margin-bottom:8px">主流宽基合计（本轮）</div>'
        +'<div style="font-size:16px;line-height:2;color:var(--text)">'+t+'</div></div>';
    })();
    nar.items.forEach(it=>{
      html+='<div style="border-left:3px solid '+tc(it.tone)+';background:rgba(127,127,127,0.06);'
        +'padding:12px 14px;border-radius:6px">'
        +'<div style="font-size:14px;color:var(--c-axis);margin-bottom:8px">'+it.h+'</div>'
        +'<div style="font-size:16px;line-height:2;color:var(--text)">'+it.t+'</div></div>';
    });
    html+='</div></div>';
  }

  document.getElementById('tabContent').innerHTML=html;
}

function sizeNfgjWrap(){
  const w=document.getElementById('nfgjWrap');
  if(!w) return;
  const top=w.getBoundingClientRect().top + window.scrollY;
  // 参考原始大图：四块 2.4/1.15/1.15/0.95，整体偏高清；
  // 视口不足时给总高下限，宁可可滚动也不要压扁
  w.style.height=Math.max(760, (window.innerHeight||800) - top - 30)+'px';
}
let _nfgjResizeT=null;
window.addEventListener('resize',()=>{
  if(!document.getElementById('nfgjWrap')) return;
  clearTimeout(_nfgjResizeT);
  _nfgjResizeT=setTimeout(()=>{
    if(window.DATA && currentTab===6) renderTab();
  },250);
});
// 面板被隐藏/恢复（innerHeight 变为 0 再恢复）时不会触发 resize，用 ResizeObserver 兜底
if(window.ResizeObserver){
  let _lastH=0;
  new ResizeObserver(()=>{
    const h=document.documentElement.clientHeight;
    if(Math.abs(h-_lastH)<40) return;
    _lastH=h;
    if(window.DATA && currentTab===6) setTimeout(renderTab,80);
  }).observe(document.documentElement);
}

      label:{show:true,position:'top',fontSize:9,color:CS('--c-text-chart'),
             formatter:p=>(p.value==null?'':p.value.toFixed(1))},
      labelLayout:{hideOverlap:true}});
    c5=echarts.init(bkEl);
    c5.setOption({
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},
        confine:true,backgroundColor:CS('--c-tip-bg'),borderColor:CS('--c-tip-border'),
        textStyle:{color:CS('--c-text-chart'),fontSize:12}},
      legend:{top:0,textStyle:{color:CS('--c-text-chart'),fontSize:11},
        data:['日频·20日','日频·60日','去重叠·20日','去重叠·60日']},
      grid:{left:64,right:26,top:36,bottom:58},
      xAxis:{type:'category',
        data:bk.labels.map((l,i)=>l+'\nn='+bk.n_daily[i]+'/'+bk.n_indep[i]),
        axisLine:{lineStyle:{color:CS('--c-axis-line')}},
        axisLabel:{color:CS('--c-axis'),fontSize:10,lineHeight:14}},
      yAxis:{type:'value',name:'平均收益 (%)',nameTextStyle:{color:CS('--c-axis'),fontSize:10},
        axisLabel:{color:CS('--c-axis'),fontSize:10},
        splitLine:{lineStyle:{color:CS('--c-grid')}}},
      series:[
        mkB(bk.daily20,'日频·20日',1,false),
        mkB(bk.daily60,'日频·60日',0.55,false),
        mkB(bk.indep20,'去重叠·20日',1,true),
        mkB(bk.indep60,'去重叠·60日',0.55,true),
      ],
    });
    window.addEventListener('resize',()=>c5.resize());
  }

  // 四张图共享十字光标与 tooltip
  [c2,c3].forEach(c=>{ if(c) c.group='nfgj'; });
  echarts.connect('nfgj');
  // 布局稳定后再校一次高度，避免首帧尺寸偏差
  requestAnimationFrame(()=>{
    sizeNfgjWrap();
    const hMain=document.getElementById('chart_nfgj_main');
    const nowFlat=hMain ? hMain.clientHeight<180 : flat;
    if(nowFlat!==flat){ renderTab(); return; }   // 高度判定变了，按新尺寸重建
    [c1,c2,c3,c4,c5].forEach(c=>{ if(c) c.resize(); });
  });
}

async function loadRealtime(){
  const box=document.getElementById('rtSnapshot');
  if(!box) return;
  try{
    const r=await fetch('api/realtime');
    if(!r.ok) throw new Error('HTTP '+r.status);
    renderRt(await r.json());
  }catch(e){
    box.innerHTML='<div style="color:var(--dim);padding:10px">实时快照获取失败（服务未启动或非交易时段）：'+e.message+'</div>';
  }
}

function renderRt(s){
  const box=document.getElementById('rtSnapshot'); if(!box) return;
  const items=(DATA.nfgj||{}).items||[];
  const cur=items[Math.min(nfgjIdx,items.length-1)]||{};
  const it=(s.indices||[]).find(x=>x.key===cur.key)||{};
  const etfs=(s.etfs||{})[cur.key]||[];
  const alerts=(s.alerts||[]).filter(a=>a.key===cur.key);
  const col=v=>v==null?'var(--dim)':(v>0?'var(--up)':v<0?'var(--down)':'var(--text)');
  const sign=v=>v==null?'--':(v>0?'+':'')+v.toFixed(2)+'%';

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex:0 0 auto">
    <div style="color:var(--accent);font-size:15px">${cur.name||''} 盘中实时快照
      <span style="color:var(--dim);font-size:12px;margin-left:8px">${s.time} · ${s.market_open?'盘中':'非交易时段'} · 流通市值标定 ${it.k_date||'--'} · 份额截至 ${it.prev_date||'--'}</span>
    </div>
    <button class="tab" style="border-radius:6px;padding:4px 10px;font-size:12px" onclick="loadRealtime()">刷新</button>
  </div>`;

  const stat=(label,val,sub,color)=>`<div style="display:flex;flex-direction:column;gap:2px;min-width:118px">
      <span style="font-size:11px;color:var(--dim)">${label}</span>
      <span style="font-size:19px;font-family:Orbitron,monospace;font-weight:600;color:${color||'var(--text)'}">${val}</span>
      <span style="font-size:11px;color:var(--dim)">${sub||''}</span></div>`;

  h+='<div style="display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-start;flex:0 0 auto;'
    +'padding:8px 0 10px;margin-bottom:10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">';
  h+=stat('盘中估算占比', it.pct!=null?it.pct.toFixed(3)+'%':'--',
          `昨收 ${it.prev_pct!=null?it.prev_pct.toFixed(3)+'%':'--'} · 变动 <span style="color:${col(it.dpp)}">${it.dpp!=null?(it.dpp>0?'+':'')+it.dpp.toFixed(3)+'pp':'--'}</span>`,
          it.pct!=null?(it.pct>=1.5?'var(--red)':'var(--accent)'):'var(--dim)');
  h+=stat('ETF 估算规模', it.etf_mv_yi!=null?it.etf_mv_yi.toFixed(0)+' 亿':'--',
          `${it.n_etf||0} 只 · 成交 ${it.amt_yi!=null?it.amt_yi.toFixed(0)+' 亿':'--'}`);
  h+=stat('指数点位', it.idx_level!=null?it.idx_level.toFixed(2):'--',
          `涨跌 <span style="color:${col(it.idx_chg)}">${sign(it.idx_chg)}</span>`, col(it.idx_chg));
  h+=stat('异动提示', alerts.length, '放量 / 偏离 / 占比跳变', alerts.length?'var(--yellow)':'var(--dim)');
  h+='</div>';

  if(alerts.length){
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;flex:0 0 auto">';
    alerts.forEach(a=>{
      const flow=a.kind==='flow';
      h+=`<span style="font-size:12px;padding:4px 10px;border-radius:12px;background:${flow?'rgba(255,145,0,0.15)':'rgba(255,215,64,0.12)'};color:${flow?'var(--orange)':'var(--yellow)'};border:1px solid rgba(255,215,64,0.28)">${flow?'资金':'ETF'} · ${a.name} · ${a.msg}</span>`;
    });
    h+='</div>';
  }else{
    h+='<div style="color:var(--dim);font-size:13px;margin-bottom:14px;flex:0 0 auto">暂无异动（阈值：放量≥1.5倍、偏离指数≥1.0pp、占比变动≥0.03pp）</div>';
  }

  h+='<div class="scroll-table" style="flex:1;min-height:180px;max-height:none"><table class="data-table"><thead><tr><th>代码</th><th>名称</th><th>现价</th><th>涨跌</th><th>成交额<br/>(亿)</th><th>估算规模<br/>(亿)</th><th>放量倍数</th><th>相对指数</th><th>异动</th></tr></thead><tbody>';
  etfs.forEach(e=>{
    h+=`<tr><td>${e.code}</td><td>${e.name}</td><td class="val">${(e.price||0).toFixed(3)}</td>`
      +`<td style="color:${col(e.chg)}">${sign(e.chg)}</td><td>${(e.amount_yi||0).toFixed(1)}</td>`
      +`<td>${(e.mv_yi||0).toFixed(0)}</td><td>${e.vol_ratio!=null?e.vol_ratio.toFixed(1)+'x':'--'}</td>`
      +`<td style="color:${col(e.dev)}">${e.dev!=null?(e.dev>0?'+':'')+e.dev.toFixed(1)+'pp':'--'}</td>`
      +`<td style="color:var(--yellow)">${(e.flags||[]).join(' · ')||''}</td></tr>`;
  });
  h+='</tbody></table></div>';
  box.innerHTML=h;
}

/* Utilities */
function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=
    now.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
    now.toLocaleTimeString('zh-CN',{hour12:false});
}
setInterval(updateClock,1000);

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}

async function syncUpdate(){
  toast('正在启动数据更新...','info');
  try{
    const r=await fetch('/api/update',{method:'POST'});
    const j=await r.json();
    if(j.ok){ toast('更新已启动，完成后自动刷新','ok'); pollStatus(); }
    else toast(j.message,'err');
  }catch(e){ toast('更新请求失败: '+e.message,'err'); }
}

function pollStatus(){
  const dot=document.getElementById('dot');
  const label=document.getElementById('updateLabel');
  dot.classList.add('running');
  label.textContent='更新中...';
  let fails=0;
  const timer=setInterval(async()=>{
    try{
      const r=await fetch('/api/status',{cache:'no-store'});
      const j=await r.json();
      fails=0;
      if(!j.running){
        clearInterval(timer); dot.classList.remove('running');
        label.textContent=j.last_update||'就绪';
        if(j.last_result&&j.last_result.success){
          toast('数据更新完成','ok'); setTimeout(()=>location.reload(),500);
        }else{
          const bad=(j.last_result&&j.last_result.steps||[]).filter(s=>!s.ok);
          const why=bad.length?('：'+bad.map(s=>s.step).join('、')+' 失败'):'';
          toast('更新失败'+why,'err');
        }
      }
    }catch(e){
      // 服务器进程退出时 fetch 会一直失败，不能无声卡在「更新中」
      if(++fails>=3){
        clearInterval(timer); dot.classList.remove('running');
        label.textContent='连接中断';
        toast('与本地服务器的连接中断，请重新运行 start.bat','err');
      }
    }
  },2000);
}

function initStatus(){
  fetch('/api/status').then(r=>r.json()).then(j=>{
    const dot=document.getElementById('dot'), label=document.getElementById('updateLabel');
    if(j.running){ dot.classList.add('running'); label.textContent='更新中...'; }
    else{ label.textContent=j.last_update||'就绪'; }
  }).catch(()=>{});
}

applyTheme((()=>{try{return localStorage.getItem('theme')||'dark'}catch(e){return 'dark'}})());
loadData();
initStatus();
</script>
